# The port the server listens on inside the pod.
port: 8080

# The server's settings for its **first start**, verbatim.
#
# The server keeps its settings in its database, on the volume below, and
# changes them from the dashboard or `PUT /aperio/api/settings` without a
# restart. What a chart can usefully say is what a new server starts with:
# everything under `initSettings:` is written out as the `settings:` section
# of a document handed to the server as `APERIO_INIT_FILE`, unchanged and
# unvalidated by the templates. The server reads it once, into an empty
# database, and refuses to start on a setting it cannot honour, naming it.
#
# Changing these values on an installed release therefore changes nothing on
# the running server, deliberately: the dashboard and this file would
# otherwise disagree about which one is the truth. To roll a settings document
# out to a running server, `POST /aperio/api/import` it.
#
# The reference is docs/reference.md and the JSON Schema published with
# each release, not a second vocabulary invented here.
initSettings: {}
#  proxy:
#    trusted: [10.0.0.0/8]
#  cache:
#    enabled: true

# The master token. Written into a Secret created by this chart.
#
# Leave empty and set `existingSecret` instead when the token comes from an
# external secret manager, which is the arrangement worth having: a token in
# a values file is a token in whatever holds your values files.
masterToken: ""
# Name of a Secret that already exists, holding the token under `tokenKey`.
existingSecret: ""
tokenKey: token

# Extra environment for the container. The server reads only its boot
# settings from the environment (see docs/configuration.md), so this is for
# those, a backup encryption key from a Secret for instance.
extraEnv: []
#  - name: APERIO_BACKUP_KEY
#    valueFrom:
#      secretKeyRef: { name: aperio-backup, key: key }

image:
  repository: ghcr.io/co3moz/aperio-server
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# One replica, and that is not a placeholder.
#
# The store is SQLite on a ReadWriteOnce volume, and two servers sharing it
# would corrupt it. Running more than one means running more than one
# deployment, each with its own volume and its own hostnames, which is a
# decision to make deliberately rather than by raising a number here.
replicaCount: 1

persistence:
  enabled: true
  size: 8Gi
  # Unset uses the cluster's default StorageClass.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  # Reuse a volume that already exists instead of the claim template.
  existingClaim: ""

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# In a cluster the ingress controller terminates TLS; the server's own HTTPS
# listener (`tls`) is for a server on a machine of its own. See "In front of
# the server" in docs/deployment.md.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tunnel.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# The probes are the endpoints added for orchestrators: `healthz` is bodiless
# and takes no locks, and `readyz` answers 503 from the moment a shutdown
# signal arrives while the process is still serving, so the load balancer
# stops routing here before the drain finishes what is in flight.
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 5

resources: {}
#  limits: { cpu: 1, memory: 512Mi }
#  requests: { cpu: 100m, memory: 128Mi }

# A tunnel server holds one socket per connected client plus the visitor
# connections in front of them, so it gets more time to drain than the default
# 30 seconds. Pair it with `shutdown_drain` in `config:`.
terminationGracePeriodSeconds: 60

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
