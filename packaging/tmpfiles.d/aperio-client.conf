# Config lives here and is read by each instance as the `aperio` user. Not
# world-readable: these files hold tunnel tokens. Also declared by the server
# package, which is harmless, tmpfiles states what should exist rather than
# creating it twice.
d /etc/aperio 0750 root aperio -

# Per-instance state (the persistent client id, so failover and `bind-tunnels`
# recognize a client across restarts). Instances get their own subdirectory
# from StateDirectory in the unit.
d /var/lib/aperio-client 0750 aperio aperio -
