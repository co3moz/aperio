# The account both services run as. A system user with no shell and no home:
# it exists to own the data directory, to be the one account that may read the
# tokens in /etc/aperio, and to be granted access to whatever local thing a
# client fronts.
#
# Shipped by both packages under its own name (aperio-server.conf,
# aperio-client.conf) rather than as one shared file, because two Debian
# packages may not carry the same path. sysusers is idempotent, so two
# identical definitions of one user are not a conflict, they are the same
# request made twice.
u aperio - "Aperio tunnel" /nonexistent /usr/sbin/nologin
