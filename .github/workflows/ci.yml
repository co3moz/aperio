name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js (dashboard build)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The warm cache is only worth its runtime if the release build can
      # actually reuse it, and what decides that is the *shape* of the cargo
      # invocations: features are unified per invocation, so building both
      # crates together and building them separately produce different
      # fingerprints for every shared dependency. Splitting the release build
      # once already left this behind for a release. Compare them here so the
      # next divergence fails a pull request instead of a tag build.
      - name: Guard, the warm cache builds what the release builds
        run: python3 tools/scripts/check-release-cache.py

      - name: Run automated tests
        run: cargo test --all

      # Guards against i18n drift: duplicate or stale (no-longer-used) keys in
      # any language dictionary fail the build; cross-language gaps are reported.
      - name: Check dashboard i18n key coverage & run unit tests
        working-directory: aperio-dashboard
        run: |
          npm ci
          npm run check-i18n
          npm run test

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Node.js (the E2E suite runs on it)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Line/region coverage of the whole workspace via rustc's LLVM
      # source-based instrumentation, merging the unit tests AND the E2E
      # integration run into one report: `show-env` points the build at the
      # instrumented artifacts, which the E2E suite picks up from
      # `target/debug`, and the server/client write their profile data on
      # the graceful SIGTERM exit, so the tunnel/proxy runtime paths count
      # too. Reported, not gated: the table lands in the job summary, the
      # full HTML report as a downloadable artifact.
      - name: Measure coverage (unit tests + e2e)
        # Test-only scaffolding (`*_tests.rs`, the shared `test_support.rs`
        # fixture) is excluded from the report, it is not shipped code and
        # should not count towards or dilute the per-file coverage numbers.
        env:
          COV_IGNORE: (_tests|test_support)\.rs$
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          # --no-fail-fast so a single failing/flaky test cannot abort the run
          # before later crates' tests emit their profraw (which would silently
          # understate coverage). The real pass/fail gate is the `build` job.
          cargo test --workspace --no-fail-fast
          cargo build -p aperio-server -p aperio-client -p mock-h2
          # A subshell rather than `working-directory:`, which would apply to
          # the whole block and take the cargo commands with it. The suite
          # inherits the instrumented environment sourced above.
          (cd tests/e2e && npm ci && npm run test:ci)
          cargo llvm-cov report --html --output-dir coverage-html --ignore-filename-regex "$COV_IGNORE"
          echo '## Coverage (unit tests + e2e)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only --ignore-filename-regex "$COV_IGNORE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "$COV_IGNORE"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-html
            lcov.info
          retention-days: 30

  audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary instead of `cargo install` (no multi-minute compile).
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Cache the RustSec advisory database between runs; a stale copy is
      # refreshed by cargo-audit's own git pull, so a weekly key is plenty.
      - name: Cache advisory database
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ github.run_id }}
          restore-keys: advisory-db-

      # Scans Cargo.lock against the RustSec advisory database. Fails the
      # build on known vulnerabilities in the dependency tree.
      - name: Audit dependencies
        run: cargo audit

  deny:
    name: Licenses, Sources & Bans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # The questions `cargo audit` does not answer: what licenses end up in
      # the shipped binaries, whether anything is being fetched from outside
      # crates.io, and whether a wildcard dependency is letting an arbitrary
      # future version in. Advisories are deliberately left to the `audit` job
      # so a known vulnerability fails one check rather than two. See deny.toml.
      - name: Check licenses, sources and bans
        run: cargo deny check licenses bans sources

  bench:
    name: Benchmarks (report)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Runs the criterion hot-path micro-benchmarks with a short measurement
      # window: it catches a bench that stops compiling and surfaces the timings
      # in the job log. Reported, not gated, a hard regression threshold needs
      # a persisted baseline, which is intentionally out of scope here.
      - name: Run benchmarks
        run: cargo bench -p aperio-server --bench hot_paths -- --warm-up-time 1 --measurement-time 2

  fuzz:
    name: Protocol Fuzzing (smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/fuzz

      # Short smoke run of each tunnel-protocol fuzz target: enough to catch a
      # parser panic introduced by a change without holding up the pipeline.
      #
      # --target is pinned to the gnu triple on purpose: install-action has no
      # cargo-fuzz binary of its own and falls back to cargo-binstall, which
      # installs the *musl* build. cargo-fuzz then defaults the fuzz target to
      # its own (musl) triple, which fails to build, musl std isn't installed
      # and ASan is incompatible with statically linked libc. Forcing gnu
      # (dynamic libc, std already present) sidesteps both.
      - name: Fuzz decode_binary_frame
        run: cargo fuzz run --fuzz-dir tools/fuzz --target x86_64-unknown-linux-gnu binary_frame -- -max_total_time=30

      - name: Fuzz tunnel-message JSON/zlib decode
        run: cargo fuzz run --fuzz-dir tools/fuzz --target x86_64-unknown-linux-gnu tunnel_message -- -max_total_time=30

  e2e:
    name: End-to-End Tunnel Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js (the E2E suite runs on it)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # `npm test` builds these too, through its `pretest`. Doing it here as
      # well costs a no-op cargo invocation and buys a build failure that
      # says "build", instead of one buried in the test step's output.
      - name: Build the binaries the suite drives
        run: cargo build -p aperio-server -p aperio-client -p mock-h2

      - name: Install the E2E suite's dependencies
        working-directory: tests/e2e
        run: npm ci

      # Real integration test: aperio-server + aperio-client + mock backends,
      # exercising proxying, dashboard APIs, and the programmatic tunnels API.
      #
      # `test:ci` runs two phases at a time rather than the four a developer
      # machine takes: a phase is a server, a client or three and a backend,
      # so four of them is a dozen processes competing for a runner's few
      # cores, and half of what this suite asserts is a timeout.
      - name: Run E2E integration test
        working-directory: tests/e2e
        run: npm run test:ci

  # ---------------------------------------------------------------------------
  # The soak's judge, without the soak (planned_features #98).
  #
  # The weekly run is where the memory curve is measured; this is the rule
  # that reads it, which is pure arithmetic over a series and therefore cheap
  # enough to check on every push. A judge that no longer catches a leak, or
  # that starts calling a sawtooth one, is worth finding here rather than in a
  # weekly job nobody watches.
  soak-rule:
    name: Soak trend rule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the rule
        run: node --test 'tests/soak/*.test.mjs'

  # ---------------------------------------------------------------------------
  # The Helm chart (planned_features #94).
  #
  # Linting a chart proves it renders. What is worth proving here is the one
  # claim the chart makes: that `values.config` is the *server's own*
  # configuration and not a second vocabulary. So the rendered ConfigMap is
  # fed to `aperio-server --check-config`, which is the same validator an
  # operator would run against a hand-written file. A key that stops being
  # accepted, or a block that stops being materialized, fails here rather than
  # on somebody's cluster.
  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js (the server build embeds the dashboard)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint the chart
        run: helm lint tools/charts/aperio-server

      # kubeconform rather than `kubectl apply --dry-run=client`, which is the
      # obvious choice and the wrong one: it downloads the OpenAPI schema from
      # an API server, so it needs a cluster, and there is none here. This
      # validates against the published Kubernetes schemas offline.
      - name: Install kubeconform
        run: |
          curl -sSfL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -C /tmp -xzf /tmp/kubeconform.tar.gz kubeconform

      - name: Render it, in the shapes people use
        run: |
          set -euo pipefail
          helm template a tools/charts/aperio-server > /tmp/default.yaml
          helm template a tools/charts/aperio-server \
            --set masterToken=apr_test \
            --set ingress.enabled=true \
            --set persistence.existingClaim=aperio-data > /tmp/full.yaml
          helm template a tools/charts/aperio-server \
            --set persistence.enabled=false > /tmp/ephemeral.yaml
          for f in /tmp/default.yaml /tmp/full.yaml /tmp/ephemeral.yaml; do
            test -s "$f"
            # Valid Kubernetes objects, not just valid YAML.
            /tmp/kubeconform -strict -summary "$f"
          done

      - name: Build the server
        run: cargo build --locked -p aperio-server

      # The claim under test: what the chart writes is a configuration the
      # server accepts, blocks and all.
      - name: The rendered config is a configuration the server accepts
        run: |
          set -euo pipefail
          cat > /tmp/values.yaml <<'YAML'
          config:
            host: 0.0.0.0
            port: 8080
            log_level: info
            trusted_proxies: ["10.0.0.0/8"]
            cache: { enabled: true, max_bytes: 268435456 }
            alert: { error_rate: 5 }
            retention: { audit_days: 30 }
            backup: { interval: 86400, dir: /var/lib/aperio/backups }
          YAML
          helm template a tools/charts/aperio-server -f /tmp/values.yaml \
            | python3 -c "
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          cm = [d for d in docs if d['kind'] == 'ConfigMap'][0]
          open('/tmp/aperio-server.yaml', 'w').write(cm['data']['aperio-server.yaml'])
          "
          cat /tmp/aperio-server.yaml
          APERIO_SERVER_TOKEN=apr_ci \
          APERIO_SERVER_CONFIG=/tmp/aperio-server.yaml \
          APERIO_DATA_DIR=/tmp/aperio-data \
            ./target/debug/aperio-server --check-config

  # ---------------------------------------------------------------------------
  # Client/server compatibility, N-1 in both directions (planned_features #89).
  #
  # A server is one box and its clients are a fleet, so the two sides are
  # always upgraded at different times. Everything else in this file tests one
  # tree against itself, which is exactly the pairing no deployment runs.
  #
  # It is a gate rather than a report: the promise is that the previous
  # release's client works against this server and this client works against
  # the previous release's server, and a promise nothing checks is a wish. The
  # wider report over *every* past release is #90 and is deliberately not a
  # gate, because an old client failing a new server is information.
  compat:
    name: Compatibility (previous release, both directions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js (the E2E suite runs on it)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # The musl builds, because they are static: a release binary from an
      # older toolchain has to run on this runner without matching its glibc.
      - name: Fetch the previous release's binaries
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$tag" ]; then
            echo "No release yet, so there is no previous version to pair with."
            echo "found=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p previous && cd previous
          for bin in aperio-server aperio-client; do
            gh release download "$tag" \
              --pattern "${bin}-x86_64-unknown-linux-musl.tar.gz" --clobber
            tar xzf "${bin}-x86_64-unknown-linux-musl.tar.gz"
            chmod +x "$bin"
          done
          echo "found=$tag" >> "$GITHUB_OUTPUT"

      - name: Build this tree's binaries
        if: steps.previous.outputs.found != ''
        run: cargo build -p aperio-server -p aperio-client -p mock-h2

      - name: Install the E2E suite's dependencies
        if: steps.previous.outputs.found != ''
        working-directory: tests/e2e
        run: npm ci

      # Named separately so a failure says which pairing broke, which is the
      # first thing anybody wants to know.
      - name: "${{ steps.previous.outputs.found }} client against this server"
        if: steps.previous.outputs.found != ''
        working-directory: tests/e2e
        env:
          APERIO_CLIENT_BIN: ${{ github.workspace }}/previous/aperio-client
        run: npm run test:compat --ignore-scripts

      - name: "This client against the ${{ steps.previous.outputs.found }} server"
        if: steps.previous.outputs.found != ''
        working-directory: tests/e2e
        env:
          APERIO_SERVER_BIN: ${{ github.workspace }}/previous/aperio-server
        run: npm run test:compat --ignore-scripts

  # ---------------------------------------------------------------------------
  # Release-cache warming, for every release target.
  #
  # Every release target builds with vendored OpenSSL for the server (a
  # from-source C build), and a tag build starts cold: GitHub scopes each
  # cache to the ref that wrote it, and a tag can only read its own + the
  # default branch's caches, never another tag's, so v0.4.0 could never reuse
  # v0.3.0's cache. These jobs populate the caches on the default branch
  # instead, where every future release tag *can* read them. rust-cache
  # stores only compiled dependencies (not the workspace crates), so the
  # expensive vendored-OpenSSL artifact is exactly what persists.
  #
  # This used to warm only the Windows target, the one slow enough to be
  # worth paying for while Actions minutes were metered. The project is
  # public now and Actions is free for it, so the whole release matrix warms:
  # a release build that restores instead of compiling is faster on every
  # target, and the trade that argued against the cheap ones is gone.
  #
  # Cost control stays: the warm jobs only spin up when Cargo.lock / a
  # Cargo.toml actually changed, i.e. when the resolved dependency set, and
  # thus the cache, could differ. Ordinary code-only pushes skip them after a
  # ~15s check. A second lookup-only probe inside each job skips the rebuild
  # entirely if the cache key is nonetheless unchanged.
  # ---------------------------------------------------------------------------
  # The guide is typeset here, and this job exists because it was not.
  #
  # `docs/book/aperio.tex` was only ever compiled during a release, so a LaTeX
  # error in it could not fail anything until the release was already running.
  # One did: a row with five cells in a four-column table, added with the
  # client-name feature, sat on master until the release that tried to publish
  # it. Typesetting is the only way to find that, since nothing else reads the
  # file.
  #
  # Gated on the book changing, in the shape `detect-deps-change` above
  # already uses, because the bundle download is not free and the file is
  # quiet between releases.
  detect-book-change:
    name: Detect guide changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the guide change?
        id: filter
        run: |
          base='${{ github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" '${{ github.sha }}' | grep -qE '^docs/book/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  book:
    name: Typeset the guide
    needs: detect-book-change
    if: needs.detect-book-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tectonic
        env:
          TECTONIC_VERSION: 0.17.0
        run: |
          curl -fsSL -o tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf tectonic.tar.gz
          sudo install -m 0755 tectonic /usr/local/bin/tectonic

      # Restore only, and save further down only when the compile worked. A
      # cache written by a failed run is how a half-downloaded bundle outlives
      # the run that created it and fails every later one.
      - name: Restore the Tectonic bundle
        id: bundle
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('docs/book/aperio.tex') }}
          restore-keys: tectonic-${{ runner.os }}-

      - name: Typeset
        working-directory: docs/book
        run: |
          # Once, then once more against a cleared cache. A restored bundle
          # missing a file it claims to have fails as "failed to open input
          # file", which reads like a broken document and is not one; that
          # cost a release. A second attempt distinguishes the two.
          if ! tectonic -X compile aperio.tex --outdir out; then
            echo "::warning::typesetting failed; retrying against a cleared bundle cache"
            rm -rf ~/.cache/Tectonic
            tectonic -X compile aperio.tex --outdir out
          fi

      - name: Save the Tectonic bundle
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('docs/book/aperio.tex') }}

  detect-deps-change:
    name: Detect dependency changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Warm only when the manifests that determine the resolved dependency set
      # (and hence rust-cache's key) changed in this push. An unknown/empty base
      # (e.g. a brand-new branch) falls through to warming, to be safe.
      - name: Did Cargo.lock / Cargo.toml change?
        id: filter
        run: |
          base='${{ github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" '${{ github.sha }}' | grep -qE '(^|/)Cargo\.(lock|toml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  warm-release-cache:
    name: Warm release cache (${{ matrix.target }})
    needs: detect-deps-change
    if: needs.detect-deps-change.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The same matrix as release.yml's build job, entry for entry: a warmed
      # target nobody releases is wasted, and a released target nobody warms
      # is the old cold start.
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installed before the probe so the cache key hashes the same rustc the
      # release job uses; otherwise the probe would key on the image's default
      # rustc and never match.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cheap existence check (no download, no save). An exact hit means the
      # resolved deps + rustc are unchanged and there is nothing to rebuild.
      # `shared-key` matches release.yml's cache step for this target exactly.
      - name: Probe release cache
        id: probe
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          lookup-only: true

      - name: Install Node.js (dashboard build)
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install musl tools
        if: steps.probe.outputs.cache-hit != 'true' && contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Exclude build dirs from Defender (Windows)
        if: steps.probe.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cl.exe","link.exe","rustc.exe","cargo.exe","nasm.exe","perl.exe" -ErrorAction SilentlyContinue

      # Restores any partial cache and, the whole point, SAVES the fresh one
      # under the default-branch scope for release tag builds to reuse.
      - name: Restore & save dependency cache
        if: steps.probe.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      # The same *two* commands release.yml runs, in the same order, because
      # the split is what decides which artifacts the release can reuse.
      # Building both crates in one invocation unifies their features, so every
      # shared dependency compiles with `vendored-openssl` switched on; the
      # release builds the client without it, gets a different fingerprint for
      # each of those dependencies, and recompiles them despite a warm cache.
      # That was the whole point of splitting the release build (the client was
      # linking 776 KB of OpenSSL it never calls), so the warm job has to
      # follow it rather than stay one command.
      - name: Build to populate cache (server, with vendored OpenSSL)
        if: steps.probe.outputs.cache-hit != 'true'
        run: cargo build --release --locked -p aperio-server --target ${{ matrix.target }} --features aperio-server/vendored-openssl

      - name: Build to populate cache (client, without it)
        if: steps.probe.outputs.cache-hit != 'true'
        run: cargo build --release --locked -p aperio-client --target ${{ matrix.target }}
