name: Conformance

# External test suites, run against the product rather than written for it.
#
# Only h2spec runs here. Autobahn needs a Docker image, and the tag this
# pinned stopped existing upstream, which is a CI failure about somebody
# else's registry rather than about this project. It is a pre-release task
# now, run locally, along with the mutation sweep: see CLAUDE.md rule 26.
#
# Weekly and on demand rather than per push: this is minutes of work and what
# it checks, conformance to RFC 6455 and RFC 9113, changes rarely. A failure
# here is a bug in the relay, not a flaky test, which is also why it is not
# allowed to fail quietly.
on:
  schedule:
    # Monday morning, before anyone is looking at it.
    - cron: "17 5 * * 1"
  workflow_dispatch:
  # So a change to the relay or to the runner itself can be checked without
  # waiting a week for the schedule.
  push:
    paths:
      - "aperio-server/src/proxy/ws.rs"
      - "aperio-client/src/proxy/ws.rs"
      - "aperio-server/src/proxy/http.rs"
      - "aperio-client/src/proxy/http.rs"
      - "tests/conformance/**"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  h2spec:
    name: h2spec (HTTP/2, RFC 9113)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build the binaries
        run: cargo build --locked -p aperio-server -p aperio-client

      # No Docker here, unlike the Autobahn job: h2spec is a single Go binary
      # the runner downloads for itself.
      - name: Run the suite
        run: node tests/conformance/h2spec.mjs

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2spec-report
          path: tests/conformance/reports
          retention-days: 30
