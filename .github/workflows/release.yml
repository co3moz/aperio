name: Release

# Tag a version (e.g. `git tag v0.2.0 && git push --tags`) and this workflow
# builds prebuilt binaries for every supported platform, attaches them to a
# GitHub Release, and publishes the multi-arch Docker images. Asset names are
# versionless so install.sh can always use the stable
# `releases/latest/download/...` URLs. The Docker images reuse the Linux musl
# binaries this same run already built (see the `docker` job) instead of
# recompiling the Rust code a second time.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js (dashboard build)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Windows Defender real-time scanning of every .obj the vendored OpenSSL C
      # build emits is a large, silent tax on this job. Exclude the build dirs
      # before anything writes to them. Best-effort: never fail the build if the
      # runner ever drops the admin rights Add-MpPreference needs.
      - name: Exclude build dirs from Defender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cl.exe","link.exe","rustc.exe","cargo.exe","nasm.exe","perl.exe" -ErrorAction SilentlyContinue

      # Restore-only. The cache this reads is populated by ci.yml's
      # `warm-release-cache` job, which runs on the default branch, the only
      # scope every release tag can read (a tag can restore its own and the
      # default-branch caches, never another tag's). `shared-key` (not `key`)
      # drops rust-cache's per-job-id component so the key matches the warm
      # job's exactly; `save-if: false` avoids churning the 10 GB cache budget
      # with per-tag copies nothing can reuse.
      - name: Restore dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          save-if: false

      # vendored-openssl: webauthn-rs pulls in openssl, and the release
      # matrix cross-compiles (x86_64 on arm64 macs, musl static) where no
      # system OpenSSL exists for the target, build it from source instead.
      # Two invocations on purpose. Building both crates at once lets Cargo
      # unify features across them, so every feature the server turns on in a
      # shared dependency (tokio, rustls, hyper, reqwest) is compiled into the
      # client too: measured at 776 KB of the client binary, for code it never
      # calls. Built separately, each gets the feature set it actually asked
      # for. The cost is that shared dependencies compile twice.
      - name: Build the server
        run: cargo build --release --locked -p aperio-server --target ${{ matrix.target }} --features aperio-server/vendored-openssl

      - name: Build the client
        run: cargo build --release --locked -p aperio-client --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-pkg
          for bin in aperio-client aperio-server; do
            tar -C "target/${{ matrix.target }}/release" -czf "dist-pkg/${bin}-${{ matrix.target }}.tar.gz" "${bin}"
            (cd dist-pkg && shasum -a 256 "${bin}-${{ matrix.target }}.tar.gz" > "${bin}-${{ matrix.target }}.tar.gz.sha256")
          done

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-pkg | Out-Null
          foreach ($bin in "aperio-client","aperio-server") {
            Compress-Archive -Path "target/${{ matrix.target }}/release/$bin.exe" -DestinationPath "dist-pkg/$bin-${{ matrix.target }}.zip"
            $hash = (Get-FileHash "dist-pkg/$bin-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
            "$hash  $bin-${{ matrix.target }}.zip" | Out-File -Encoding ascii "dist-pkg/$bin-${{ matrix.target }}.zip.sha256"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: dist-pkg/*
          # Only needed for the release job in this same run, keep storage low.
          retention-days: 1

  schema:
    name: Generate config schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Two copies of the same schema: a versioned one for pinning, and a
      # versionless one so schema managers (editor yaml.schemas, SchemaStore,
      # $schema references) get a stable URL that always serves the latest:
      # releases/latest/download/aperio-client.schema.json
      - name: Generate config schemas (versioned + stable names)
        run: |
          mkdir -p dist-pkg
          cargo run --locked -p aperio-config > "dist-pkg/aperio-client.${GITHUB_REF_NAME}.json"
          cp "dist-pkg/aperio-client.${GITHUB_REF_NAME}.json" dist-pkg/aperio-client.schema.json
          cargo run --locked -p aperio-config -- --server > "dist-pkg/aperio-server.${GITHUB_REF_NAME}.json"
          cp "dist-pkg/aperio-server.${GITHUB_REF_NAME}.json" dist-pkg/aperio-server.schema.json

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: config-schema
          path: dist-pkg/*
          retention-days: 1

  # The Complete Guide as a PDF, attached to every release. Built with
  # Tectonic: one static binary, no TeX distribution to install (Ubuntu has no
  # `tectonic` package, and a full TeX Live is a multi-gigabyte image to pull
  # for one document). It fetches the packages the book uses on first run and
  # caches them, so a repeat release is a download of nothing.
  book:
    name: Build the guide (PDF)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tectonic
        env:
          TECTONIC_VERSION: 0.17.0
        run: |
          curl -fsSL -o tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf tectonic.tar.gz
          sudo install -m 0755 tectonic /usr/local/bin/tectonic
          tectonic --version

      # The TeX package bundle, not the build output: without this every
      # release re-downloads a few hundred files to typeset the same book.
      - name: Cache the Tectonic bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('docs/book/aperio.tex') }}
          restore-keys: tectonic-${{ runner.os }}-

      # The version on the title page is written by hand during the release
      # bump (see docs/development.md). Publishing a PDF that disagrees with
      # the tag on its cover is worse than not publishing one, so it is a
      # build failure rather than something to notice later.
      - name: Check the book's version matches the tag
        run: |
          declared="$(grep -o 'Version [0-9][0-9.]*' docs/book/aperio.tex | head -1 | cut -d' ' -f2)"
          expected="${GITHUB_REF_NAME#v}"
          if [ "${declared}" != "${expected}" ]; then
            echo "::error::docs/book/aperio.tex says Version ${declared}, the tag says ${expected}"
            exit 1
          fi

      # Two names, like the config schema above: a versioned one to link to a
      # specific release, and a stable one so
      # releases/latest/download/aperio-guide.pdf always serves the current
      # book.
      - name: Build the guide
        run: |
          mkdir -p dist-pkg
          tectonic -X compile docs/book/aperio.tex --outdir dist-pkg
          mv dist-pkg/aperio.pdf "dist-pkg/aperio-guide.${GITHUB_REF_NAME}.pdf"
          cp "dist-pkg/aperio-guide.${GITHUB_REF_NAME}.pdf" dist-pkg/aperio-guide.pdf

      - name: Upload the guide
        uses: actions/upload-artifact@v4
        with:
          name: guide-pdf
          path: dist-pkg/*.pdf
          retention-days: 1

  # Publish the multi-arch (amd64+arm64) images straight from the musl-static
  # binaries the `build` matrix already produced, the Dockerfiles just copy the
  # right binary in, so nothing is compiled twice. One buildx build per image
  # emits the multi-arch manifest directly (the COPY-only images make the small
  # cross-arch emulation for `apk add ca-certificates` negligible).
  docker:
    name: Build & Push Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [aperio-server, aperio-client]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Only the two Linux musl artifacts are needed for the images; they are
      # merged into ./pkg/ regardless of which build-matrix job produced them.
      - name: Download prebuilt Linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*-linux-musl
          path: pkg
          merge-multiple: true

      # The Dockerfile copies dist-docker/<image>-<TARGETARCH>; TARGETARCH is
      # Docker's arch name (amd64/arm64), so map the Rust target triples to it.
      - name: Stage binaries by Docker arch
        run: |
          set -euo pipefail
          mkdir -p dist-docker
          tar -xzf "pkg/${{ matrix.image }}-x86_64-unknown-linux-musl.tar.gz" -C dist-docker
          mv "dist-docker/${{ matrix.image }}" "dist-docker/${{ matrix.image }}-amd64"
          tar -xzf "pkg/${{ matrix.image }}-aarch64-unknown-linux-musl.tar.gz" -C dist-docker
          mv "dist-docker/${{ matrix.image }}" "dist-docker/${{ matrix.image }}-arm64"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tags: the exact ref (v0.2.0), the semver forms (0.2.0 / 0.2 / 0), and
      # `latest`. `latest=auto` + the semver patterns are skipped for a
      # pre-release tag (e.g. v1.0.0-rc1), which then only gets its exact tag.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=auto
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.image }}/Dockerfile.workflow
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, schema, book]
    steps:
      # `actions/download-artifact` intermittently fails ("Artifact download
      # failed after 5 retries") on GitHub's artifact backend. Pull the run's
      # artifacts with the gh CLI and retry a few times so a transient hiccup
      # doesn't publish a release with no assets. Each artifact lands under
      # dist-pkg/<artifact-name>/.
      - name: Download release assets (with retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist-pkg
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --dir dist-pkg; then
              ok=1
              echo "Downloaded artifacts on attempt ${attempt}"
              break
            fi
            echo "Attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::Failed to download run artifacts after 5 attempts"
            exit 1
          fi
          ls -R dist-pkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-pkg/**/*
          generate_release_notes: true
