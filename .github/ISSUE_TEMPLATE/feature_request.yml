name: Feature request
description: Something Aperio should be able to do and cannot.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Worth two minutes first: [planned_features.md](https://github.com/co3moz/aperio/blob/master/planned_features.md)
        lists what is already planned, what shipped, and what was **withdrawn
        with the reason**. If the idea is in the last group, the reason it was
        dropped is the thing to argue with.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What you are trying to do and where it stops. Describe the situation,
        not the feature: the best version of the answer is often not the
        mechanism you had in mind.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: >
        The workaround, even an ugly one, and what it costs. A feature request
        with no workaround behind it usually turns out to be two features.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What it might look like
      description: >
        Optional. A yaml key, a flag, a dashboard control, an endpoint. If it is
        a setting, remember it needs a name that works as yaml, as an
        environment variable and in the docs.
      render: yaml
