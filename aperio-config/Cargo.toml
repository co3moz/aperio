[package]
name = "aperio-config"
version = "0.13.0"
edition = "2024"
license = "MIT"
# The minimum toolchain, so `cargo` says which version is missing instead of
# failing somewhere inside a dependency. Edition 2024 needs 1.85; the code
# reaches past it (`is_multiple_of`, stable in 1.87), which is what declaring
# this turned up, the number in the docs said 1.85 and nothing checked.
rust-version = "1.88"

# Shared schema of the client `aperio.yaml` file. Kept as its own crate so the
# aperio-client build script can derive a JSON Schema from the exact same types
# the client parses with, no drift between the parser and the editor schema.

[features]
openapi = ["dep:utoipa"]

[dependencies]
utoipa = { version = "5", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = { version = "1", features = ["indexmap2"] }
# Services, tunnels and binds are maps kept in the order a file writes them.
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0"
