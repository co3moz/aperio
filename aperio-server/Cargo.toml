[package]
name = "aperio-server"
version = "0.10.0"
edition = "2024"
license = "MIT"
# Binaries, distributed as release artifacts and container images rather than
# through crates.io. Stated rather than assumed, so an accidental `cargo
# publish` fails instead of uploading a server.
publish = false
# The minimum toolchain, so `cargo` says which version is missing instead of
# failing somewhere inside a dependency. Edition 2024 needs 1.85; the code
# reaches past it (`is_multiple_of`, stable in 1.87), which is what declaring
# this turned up, the number in the docs said 1.85 and nothing checked.
rust-version = "1.87"

[dependencies]
rust-embed = "8"
# Only present to expose the `vendored` switch of the openssl that
# webauthn-rs already pulls in: the release workflow compiles OpenSSL from
# source (feature `vendored-openssl` below) so cross-compiled and
# musl-static targets don't need a system OpenSSL for the build target.
openssl = { version = "0.10", optional = true }
mime_guess = "2"
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.8", features = ["ws", "http2"] }
# Salts and TOTP secrets come from `OsRng`, which `rand_core` only exposes with
# `getrandom`. It used to arrive through feature unification, from a crate that
# happened to ask for it; nothing said so, and an unrelated dependency bump
# turned it off. A security-critical source of randomness should not be
# somebody else's feature flag.
rand_core = { version = "0.6", features = ["getrandom"] }
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "catch-panic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The optional aperio-server.yaml config file (same crate the client uses).
serde_yaml = "0.9"
# Shared config schema: `--print-schema` emits the aperio-server.yaml JSON schema.
aperio-config = { path = "../aperio-config" }
base64 = "0.22"
# The AES-256-GCM used for encrypted backups (`backup_crypto.rs`). Already in
# this binary through rustls, so naming it here adds an algorithm rather than a
# crypto stack, and keeps the "one provider" rule the notes below describe.
ring = "0.17"
# The shutdown integration test delivers a real SIGTERM to its own process.
libc = "0.2"
uuid = { version = "1.8", features = ["v4"] }
subtle = "2"
sha2 = "0.10"
hmac = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures-util = "0.3"
chrono = "0.4"
# IANA time zones for scheduled maintenance windows: a window written as
# 02:00 local has to stay 02:00 local across a daylight-saving change, which a
# fixed offset cannot do.
chrono-tz = "0.10"
# Single-file persistent store (tokens/webhooks/stats/users) at <data_dir>/aperio.db.
rusqlite = { version = "0.40", features = ["bundled"] }
# Password hashing for dashboard users.
argon2 = "0.5"
# OpenAPI spec generation for the admin API (/aperio/api/openapi.json).
utoipa = { version = "5", features = ["axum_extras"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# One reqwest for the whole binary. It used to be two: 0.12 here for our own
# outbound calls, and the 0.13 that opentelemetry-otlp pulls, aliased as
# `reqwest_otlp`. OTLP is not optional, so every server linked two complete
# HTTP stacks. `rustls-no-provider` keeps it off aws-lc-rs and on the ring
# provider installed at startup; see NOTE 2 below, which this dependency is
# now the whole of. `form` is separate in 0.13 and the OIDC token exchange
# posts one; `blocking` is the OTLP exporter's client.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "form",
  "rustls-no-provider",
  "blocking",
] }
url = "2.5"
flate2 = "1"
# OpenTelemetry OTLP trace export (opt-in via APERIO_OTEL). Both transports the
# OTLP spec defines are built in and picked by `otel.protocol`: HTTP/protobuf
# over reqwest+rustls (the default), and gRPC over tonic for collectors that
# only listen on 4317.
# NOTE 1: we use otlp's `reqwest-blocking-client`, NOT `reqwest-client` (async).
# The batch span processor drives the exporter from its own dedicated OS thread
# with no Tokio runtime; the async reqwest client panics there ("there is no
# reactor running") the moment a real span is exported, so nothing ever reaches
# the collector. The blocking client owns an internal runtime and exports fine
# from that thread.
# NOTE 2: we deliberately do NOT enable otlp's `reqwest-rustls` feature, on
# reqwest 0.13 that resolves to the aws-lc-rs crypto provider, a heavy C/asm
# build (aws-lc-sys) that dominates the Windows release build. Instead the
# single `reqwest` dependency above pins `rustls-no-provider`, which reuses the
# process-wide ring CryptoProvider we install at startup (see main.rs) and the
# same rustls-platform-verifier roots, no second crypto backend gets compiled.
# NOTE 3: the gRPC side is `tls-ring` + `tls-roots`, never `tls-aws-lc`, for the
# same reason as NOTE 2, tonic then builds its rustls client on the ring
# provider the process already installed, and reads the platform's root store.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "trace",
  "http-proto",
  "reqwest-blocking-client",
  "grpc-tonic",
  "tls-ring",
  "tls-roots",
] }
tracing-opentelemetry = "0.33"
opentelemetry-semantic-conventions = "0.32"
sha1 = "0.10"
http-body = "1"
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }
regex = "1.13.0"
socket2 = "0.6.4"
# Pinned to the 9 line on purpose, and moving off it is a crypto-backend
# decision rather than a version bump (planned_features #110). 9 builds on
# `ring`, which rustls already puts in every one of these binaries, so it adds
# no crypto stack and no new cross-compilation surface. 10 and 11 dropped ring
# for `aws-lc-rs` or the RustCrypto stack; either would be a third crypto
# implementation here, and aws-lc-rs would be new build surface on musl and
# Windows, the two targets #2 records as the openssl pain.
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }

[features]
# Used by the release workflow: build OpenSSL from source for the target
# instead of probing the host system (cross-compilation, musl static).
vendored-openssl = ["dep:openssl", "openssl/vendored"]

[dev-dependencies]
# `start_paused` in tests: the live stream ticks every two seconds, and a test
# that actually waits them is a test nobody runs.
tokio = { version = "1.38", features = ["full", "test-util"] }
# The in-memory span exporter, so the phase-span emitter can be asserted on
# real exported spans instead of being the one untestable corner of tracing.
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "testing"] }
criterion = "0.8.2"
# Drives the composed router in-process (ServiceExt::oneshot) for the
# startup-wiring tests that used to be possible only through e2e.
tower = { version = "0.5", features = ["util"] }
# The integration tests speak to the composed server over a socket and mint
# their own throwaway data dirs; both crates are already regular deps, listed
# here again because an integration test only links dev-dependencies.
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# For the envelope-codec benchmark: what MessagePack would cost against the
# JSON the tunnel speaks today, measured on our own messages.
rmp-serde = "1.3"
# Software WebAuthn authenticator (SoftPasskey) to drive full register /
# authenticate ceremonies in webauthn.rs unit tests. Pinned to 0.5.5 so it
# resolves the same webauthn-rs-proto as webauthn-rs (credential types unify).
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }
# In-process WebSocket client to drive the tunnel handshake in ws/tcp tests.
# Matches the client's, deliberately. It was 0.24 while the client was on
# 0.29, which put a second tungstenite in the tree and with it the last
# consumers of rand 0.8 and rand_chacha 0.3. Nothing ships from here (these
# are the tests that dial the server as a real client would), but a dev
# dependency still costs a compile and still shows up in an audit.
tokio-tungstenite = "0.29"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[[bench]]
name = "hot_paths"
harness = false
