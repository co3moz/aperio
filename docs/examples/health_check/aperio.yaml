server:
  url: https://tunnel.example.com
  token: apr_health_check_multi_change_me

# Shared probe tuning; entries may override any of these individually.
defaults:
  health:
    interval: 10s
    timeout: 5s
    threshold: 2

services:
  web:
    access: public
    target: http://localhost:3000
    hostname: app.example.com
    health:
      endpoint: /health           # probed independently of the API

  api:
    access: public
    target: http://localhost:4000
    hostname: api.example.com
    health:
      endpoint: /api/status       # its own endpoint and its own rotation
      interval: 5s                # per-entry override: probe faster

  docs:
    access: public
    target: http://localhost:5000
    path: /docs                   # no probe: routed as long as the tunnel is up
