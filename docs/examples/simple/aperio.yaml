# The Aperio server to dial out to, and the token that authorizes this client.
# The token must match `server.token` in aperio-server.yaml.
server:
  url: https://tunnel.example.com
  token: apr_simple_change_me

# What this client exposes. A file always describes its backends under
# `services:`, even when there is exactly one; a top-level `target:` has not
# been accepted since 0.9.0.
# A bare port (`3000`) or hostname (`example.com`) is normalized to a URL.
services:
  - target: http://localhost:3000
    public: true

version: 0.11.0
