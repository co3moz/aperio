# Declaring side, run next to the private services.
server:
  url: https://tunnel.example.com
  token: apr_emergency_change_me

# Optional: a client may declare only tunnels, with no public service at all.
services:
  - target: http://localhost:3000

# Private local services another client may reach via --bind-tunnels; never
# exposed to the public web. The `name` is the handle binders address, so it
# survives restarts, parallel connections and a services: list.
tunnels:
  - name: mongo
    target: 127.0.0.1:27017     # MongoDB
    protocol: tcp               # tcp is the default
  - name: ssh
    target: 127.0.0.1:22
  - name: dns
    target: 127.0.0.1:53        # internal DNS resolver
    protocol: tcp/udp           # one tunnel, one local port, both transports
    idle_timeout: 10            # the udp half: relay expiry in seconds (default 60)
