# Declaring side, run next to the private services.
server:
  url: https://tunnel.example.com
  token: apr_emergency_change_me

# Optional: a client may declare only tunnels, with no public service at all.
services:
  web:
    target: http://localhost:3000
    access: public

# Private local services another client may reach with `aperio-client
# bind`; never exposed to the public web. The key each is written under is
# the name binders address, so it survives restarts and parallel connections.
tunnels:
  mongo:
    target: 127.0.0.1:27017     # MongoDB
    protocol: tcp               # tcp is the default
  ssh:
    target: 127.0.0.1:22
  dns:
    target: 127.0.0.1:53        # internal DNS resolver
    protocol: tcp/udp           # one tunnel, one local port, both transports
    idle_timeout: 10s           # the udp half: relay expiry (default 60s)
