# Reacting side: run this next to whatever should act on a message.
server:
  url: https://tunnel.example.com
  token: apr_messaging_change_me

services:
  - target: http://localhost:3000
    hostname: app.example.com

# What this client listens for. Filters are MQTT's: `+` is one level, `#` is
# the rest and is only legal last.
subscribe:
  # A bare filter listens and nothing more; whatever attaches to the local
  # faces below receives it.
  - deploy/#

  # An entry that names a command runs it for every matching message, with no
  # application involved. The message body arrives on the command's stdin;
  # APERIO_MESSAGE_TOPIC and APERIO_MESSAGE_ID are in its environment.
  #
  # This is a remote-execution primitive: a message published by another
  # client of the organization makes this run. Keep the topic narrow, and
  # mint the tokens that may publish to it with a matching `topics` scope.
  - topic: deploy/web
    run: ./deploy.sh
    timeout: 120          # seconds before the run is killed (default 60)
    max_concurrent: 1     # runs at once; the rest are dropped, not queued

  # The server's own events, on the reserved namespace. A bare `#` above does
  # not match these, so they have to be asked for by name.
  - $aperio/client/#

# Where an application on this machine attaches. Both may run at once and
# share one subscription set; drop whichever you do not need.
messages_listen: 127.0.0.1:1888        # SSE to subscribe, POST to publish
messages_mqtt_listen: 127.0.0.1:1883   # MQTT 3.1.1, for an existing client library
