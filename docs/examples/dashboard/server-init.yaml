# First-start settings for this example, read once into an empty data
# directory. Start the server with:
#
#   APERIO_SERVER_TOKEN=apr_dashboard_change_me APERIO_INIT_FILE=server-init.yaml aperio-server
#
# After the first start the settings live in the database: change them from
# the dashboard (Settings), with `PUT /aperio/api/settings`, or export them
# with `GET /aperio/api/export?include=settings`.

settings:
  # The dashboard is built in at /aperio. You sign in as user "aperio" with
  # the master token. To let anyone else in without sharing it, create a
  # named dashboard user (Users page) or give them their own organization,
  # there is no second server-wide password.
  security:
    # Fence the authenticated dashboard and most admin API routes to your
    # operator network. Login and selected self-authenticating API endpoints
    # stay reachable; see docs/configuration.md for the exact exceptions.
    admin_allowed_ips:
      - 10.0.0.0/8
      - 203.0.113.7
  dashboard:
    # Default dashboard / login language when the browser's language is
    # unsupported.
    ui_language: en
    # To run headless with no dashboard at all:
    # enabled: false
