server:
  token: apr_dashboard_change_me
port: 8080

# The dashboard is built in at /aperio. You sign in as user "aperio" with the
# master token above. To let anyone else in without sharing it, create a named
# dashboard user (Users page) or give them their own organization, there is no
# second server-wide password.

# Fence the authenticated dashboard and most admin API routes to your operator
# network. Login and selected self-authenticating API endpoints stay reachable;
# see docs/configuration.md for the exact exceptions.
admin_allowed_ips:
  - 10.0.0.0/8
  - 203.0.113.7

# Default dashboard / login language when the browser's language is unsupported.
ui_language: en

# To run headless with no dashboard at all, set:
# dashboard: false

version: 0.11.0
