server:
  url: https://tunnel.example.com
  token: apr_resilience_multi_change_me

services:
  www:
    access: public
    target: http://localhost:3000
    hostname: www.example.com
    cache: {enabled: true, offline: true}  # keep answering from cache while offline

  api:
    access: public
    target: http://localhost:4000
    hostname: api.example.com
    # no cache: stale API responses would be worse than a 504
