server:
  token: apr_share_change_me
  # Share links grant temporary, gate-free access to a site that is otherwise
  # gated. Put a visitor login in front of everything proxied so there is a
  # gate to bypass with a link (OIDC works the same way, see the s_oidc
  # example). Format is user:password.
  auth: viewer:a-visitor-password
port: 8080
