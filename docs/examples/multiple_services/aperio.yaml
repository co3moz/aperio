server:
  url: https://tunnel.example.com
  token: apr_services_change_me

# Several backends from one client, one tunnel connection per entry.
# Per-entry fields override the top-level ones; binds are strictly per entry.
services:
  # `name:` is the handle (a-z, 0-9, _); `custom_name:` is the label the
  # dashboard and the client logs show, and can say anything.
  - name: web
    custom_name: "Public Web"
    target: http://localhost:3000
    hostname: app.example.com
    health:
      endpoint: /health         # probe the backend, leave rotation when down

  - name: api
    target: http://localhost:4000
    hostname: api.example.com
    max_concurrent: 8               # server queues the excess instead of flooding

  - name: docs
    target: http://localhost:5000
    path: /docs                     # path bind; the prefix is stripped by default
