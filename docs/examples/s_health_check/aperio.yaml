server:
  url: https://tunnel.example.com
  token: apr_health_check_change_me

target: http://localhost:3000

# Backend health probing. `endpoint` is a path (resolved against the target)
# or a full URL; when set, a failing backend leaves rotation without dropping
# the tunnel. The rest are the defaults: probe every 10 s, 5 s per probe,
# 2 consecutive failures before the backend is reported unhealthy.
health:
  endpoint: /health
  interval: 10
  timeout: 5
  threshold: 2
