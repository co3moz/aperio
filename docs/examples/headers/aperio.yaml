server:
  url: https://tunnel.example.com
  token: apr_headers_multi_change_me

# What every service gets unless its own entry says otherwise.
defaults:
  headers:
    response:
      remove: [X-Powered-By]

services:
  web:
    access: public
    target: http://localhost:3000
    hostname: app.example.com
    # no headers: here, so the rules under defaults: apply as written

  api:
    access: public
    target: http://localhost:4000
    hostname: api.example.com
    # An entry's headers: is laid over the default one key by key, and a
    # list it writes replaces the default's: `remove` below is the whole
    # list, so it names X-Powered-By again.
    headers:
      request:
        add:
          X-Service: api
        remove: [X-Internal-Debug]
      response:
        add:
          Cache-Control: no-store
        remove: [Server, X-Powered-By]
