server:
  url: https://tunnel.example.com
  token: apr_sticky_change_me

services:
  app:
    target: http://localhost:3000
    access: public
    hostname: app.example.com

# Visitor affinity keys on the client's id. A client reading this file keeps
# the id it generated on its first run (under ~/.aperio/clients/), so a
# restart keeps its pinned visitors, and each machine has an id of its own
# without anyone writing one.
