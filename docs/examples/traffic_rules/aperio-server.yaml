server:
  token: apr_traffic_rules_change_me
port: 8080

# Aggregate requests-per-second ceilings for a route, independent of the
# per-visitor IP limit: one visitor under the IP limit times a thousand
# visitors is still a thousand times the load on one backend.
rate_limits:
  # The login endpoint takes 5 requests a second across ALL visitors, with a
  # short burst allowance. A refused request answers 429 and names the limit
  # that fired in its `x-aperio-limit` header.
  - hostname: api.example.com
    path: /api/login
    rps: 5.0
    burst: 10.0
  # Everything else on the API host shares a larger ceiling.
  - hostname: api.example.com
    rps: 200.0

# WAF-lite: deny or size-cap a request before it is proxied. A rule fires
# when every condition it sets matches.
waf:
  # Nobody serves WordPress here, so the scanner probes stop at the edge.
  - path: ^/wp-admin
  # Known scanner user-agents are turned away with 403.
  - header:
      name: user-agent
      regex: (?i)sqlmap|nikto
  # Uploads to this route are capped at 1 MB, answered 413 above it.
  - path: ^/upload
    methods: [POST, PUT]
    max_body: 1048576

# Where visitors of an unserved hostname go, instead of a gateway error:
# the status page, keeping the path they asked for.
fallbacks:
  - hostname: app.example.com
    url: https://status.example.com
    preserve_path: true

# Per-hostname 503/504 pages, overriding the global `503_page`/`504_page`
# for that host. A maintenance flag's `{reason}` and `{until}` are filled in
# where the page writes them.
error_pages:
  - hostname: app.example.com
    503_page: ./pages/app-503.html
    504_page: ./pages/app-504.html
