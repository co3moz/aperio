# The client side of this pair is deliberately plain: every rule in
# server-init.yaml is enforced by the server before a request reaches the
# tunnel, so the client neither declares nor sees any of it.
server:
  url: https://tunnel.example.com
  token: apr_traffic_rules_change_me

services:
  api:
    access: public
    target: http://localhost:4000
    hostname: api.example.com
  app:
    access: public
    target: http://localhost:3000
    hostname: app.example.com
