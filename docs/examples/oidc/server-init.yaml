# First-start settings for this example, read once into an empty data
# directory. Start the server with:
#
#   APERIO_SERVER_TOKEN=apr_oidc_change_me APERIO_INIT_FILE=server-init.yaml aperio-server
#
# After the first start the settings live in the database: change them from
# the dashboard (Settings), with `PUT /aperio/api/settings`, or export them
# with `GET /aperio/api/export?include=settings`.

settings:
  oidc:
    # Setting the issuer enables SSO enforcement for everything proxied.
    issuer: https://accounts.google.com
    client_id: replace-with-your-oauth-client-id
    client_secret: replace-with-your-oauth-client-secret
    # Who may sign in: exact addresses, *@domain, or * for anyone the issuer
    # authenticates. Required together with the issuer.
    allowed_emails:
      - "*@example.com"
      - contractor@partner.org
    # Recommended: pin the callback URL instead of deriving it per request.
    # Must match the redirect URI registered at the issuer.
    redirect_url: https://tunnel.example.com/aperio/oidc/callback
    # Requested scopes (default shown).
    scopes: openid email profile
