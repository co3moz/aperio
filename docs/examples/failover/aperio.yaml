server:
  url: https://tunnel.example.com
  token: apr_failover_change_me

services:
  web:
    target: http://localhost:3000
    hostname: "*"               # every hostname no other service claims
    access: public

# The server's `wait` failover recognizes this client when it reconnects
# after a crash or redeploy by its id, which a client reading this file
# keeps under ~/.aperio/clients/ from its first run. A container that starts
# fresh each time gives it one with `client_id_file` on a volume.
