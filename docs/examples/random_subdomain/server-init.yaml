# First-start settings for this example, read once into an empty data
# directory. Start the server with:
#
#   APERIO_SERVER_TOKEN=apr_preview_change_me APERIO_INIT_FILE=server-init.yaml aperio-server
#
# After the first start the settings live in the database: change them from
# the dashboard (Settings), with `PUT /aperio/api/settings`, or export them
# with `GET /aperio/api/export?include=settings`.

settings:
  routing:
    # Every connecting client gets `<random>-preview.example.com` in addition
    # to its other binds. Front the server with wildcard DNS and one wildcard
    # TLS certificate for `*.example.com`.
    random_subdomain: "*-preview.example.com"
    # Keep preview environments out of search engines: noindex headers and a
    # disallow-all robots.txt on the random hostnames.
    preview_noindex: true
