server:
  url: https://tunnel.example.com
  token: apr_tuning_multi_change_me

# Shared defaults; entries override what they need.
defaults:
  timeout: 30s
  limits:
    concurrent_requests: 8

services:
  api:
    access: public
    target: http://localhost:4000
    hostname: api.example.com
    connections: 4               # parallel tunnel connections for hot traffic
    limits: {concurrent_requests: 32}  # per-connection cap; excess queues at the server

  reports:
    access: public
    target: http://localhost:5000
    hostname: reports.example.com
    timeout: 5m                  # report generation is slow by nature
    response_timeout: 5m         # ask the server to wait this long too, or it
                                 # gives up at its own gateway timeout first
    limits:
      response_body: 200MB       # exports
      request_body: 50MB         # bigger uploads answer 413 at the server,
                                 # before they enter the tunnel

  media:
    access: public
    target: http://localhost:6000
    hostname: media.example.com
    bandwidth: 8mbit             # server paces responses to this rate
    inspector: false             # keep this firehose out of the request
                                 # inspector; traffic and statistics still count
