server:
  url: https://tunnel.example.com
  token: apr_observability_change_me

services:
  web:
    target: http://localhost:3000
    hostname: "*"               # every hostname no other service claims
    access: public
    # A health probe makes client-down alerting meaningful: the server learns
    # about a dead backend, not just a dead tunnel. The probe path belongs to
    # the backend it probes, so it lives on the entry.
    health:
      endpoint: /health
